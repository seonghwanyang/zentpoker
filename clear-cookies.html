<!DOCTYPE html>
<html>
<head>
    <title>Clear Supabase Cookies</title>
</head>
<body>
    <h1>Supabase Cookie 정리</h1>
    <button onclick="clearCookies()">쿠키 정리하기</button>
    <div id="result"></div>
    
    <script>
        function clearCookies() {
            // 모든 쿠키 가져오기
            const cookies = document.cookie.split(';');
            
            // Supabase 관련 쿠키 찾아서 삭제
            cookies.forEach(cookie => {
                const eqPos = cookie.indexOf('=');
                const name = eqPos > -1 ? cookie.substr(0, eqPos).trim() : cookie.trim();
                
                // Supabase 관련 쿠키인 경우 삭제
                if (name.includes('supabase') || name.includes('sb-')) {
                    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    console.log('Deleted cookie:', name);
                }
            });
            
            // localStorage도 정리
            Object.keys(localStorage).forEach(key => {
                if (key.includes('supabase') || key.includes('sb-')) {
                    localStorage.removeItem(key);
                    console.log('Deleted localStorage:', key);
                }
            });
            
            document.getElementById('result').innerHTML = 
                '<p style="color: green;">쿠키 정리 완료! 새로고침 후 다시 로그인하세요.</p>';
        }
    </script>
</body>
</html>
